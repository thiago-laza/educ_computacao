                    currentTheme = artigo.theme;
                    const h2 = document.createElement('h2');
                    h2.textContent = currentTheme;
                    container.appendChild(h2);
                }

                const card = document.createElement('div');
                card.className = 'article-card';

                const titleSpan = document.createElement('span');
                titleSpan.className = 'article-title';
                titleSpan.textContent = artigo.title;
                card.appendChild(titleSpan);

                buttonsDiv.className = 'buttons';

                originalBtn.href = artigo.original;
                originalBtn.className = 'btn-original';
                originalBtn.textContent = 'Ler Original';
                originalBtn.target = '_blank';

                    translatedBtn.href = artigo.translated;
                    translatedBtn.className = 'btn-traduzido';
                    translatedBtn.textContent = 'Ler Tradução';
